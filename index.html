<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Live Dashboard</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--radius:10px;--accent:#06b6d4}
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial}
    body{background:linear-gradient(180deg,#071025 0%,#071827 100%);display:flex;align-items:center;justify-content:center;padding:24px}
    .wrap{width:100%;max-width:1100px;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));border-radius:var(--radius);box-shadow:0 6px 30px rgba(2,6,23,0.6);overflow:hidden;border:1px solid rgba(255,255,255,0.03)}
    .header{display:flex;align-items:center;gap:12px;padding:14px 18px;background:linear-gradient(90deg,rgba(255,255,255,0.02),transparent)}
    .logo{width:36px;height:36px;border-radius:8px;background:var(--accent);display:inline-block}
    .title{color:#e6eef6;font-weight:600;font-size:15px}
    .iframe-container{width:100%;height:720px;min-height:480px}
    iframe{width:100%;height:100%;border:0;border-radius:0 0 var(--radius) var(--radius);display:block}
    @media (max-width:640px){
      .iframe-container{height:560px}
      .title{font-size:14px}
    }
  </style>
</head>
<body>
  <div class="wrap" role="region" aria-label="Live data viewer">
    <div class="header">
      <span class="logo" aria-hidden="true"></span>
      <div class="title">Live Dashboard</div>
    </div>

    <div class="iframe-container">
      <iframe
        src="https://yourworstnightmare1.github.io/proxy-list/?embed=1"
        title="Live data viewer"
        loading="lazy"
        width="100%"
        height="720"
        style="border:0;border-radius:8px;max-width:100%;min-height:480px;"
        referrerpolicy="no-referrer"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
      ></iframe>
    </div>
  </div>
</body>
</html>
